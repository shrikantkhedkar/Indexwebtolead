<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    min-height:100vh;
    background:url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?q=80&w=1920') center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.container{
    background:#ffffff;
    width:100%;
    max-width:650px;
    padding:30px;
    box-shadow:0 5px 25px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:#333;
    font-size:42px;
    font-weight:300;
    line-height:1.3;
    margin-bottom:30px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full-width{
    grid-column:1/3;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#222;
    text-transform:uppercase;
    font-size:13px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #d9d9d9;
    background:#fff;
    font-size:14px;
}

input:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:#ff7f3f;
}

textarea{
    resize:vertical;
    min-height:100px;
}

button{
    width:100%;
    background:#ff7f3f;
    color:white;
    border:none;
    padding:16px;
    font-size:16px;
    font-weight:bold;
    text-transform:uppercase;
    cursor:pointer;
}

button:hover{
    background:#f36c28;
}

@media(max-width:768px){

    body{
        padding:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full-width{
        grid-column:auto;
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>
Turn to an experienced team that handles leads professionally.
</h1>

<form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dbn00000ohwlV" method="POST">

<input type="hidden" name="oid" value="00Dbn00000ohwlV">
<input type="hidden" name="retURL" value="https://creative-palmier-1a514b.netlify.app/thankyou.html">

<div class="form-grid">

<div>
<label>First Name *</label>
<input type="text" name="first_name">
</div>

<div>
<label>Last Name *</label>
<input type="text" name="last_name" required>
</div>

<div>
<label>Email *</label>
<input type="email" name="email">
</div>

<div>
<label>Phone *</label>
<input type="text" name="phone">
</div>

<div>
<label>Company *</label>
<input type="text" name="company" required>
</div>

<div>
<label>City</label>
<input type="text" name="city">
</div>

    <div class="full-width">
<label>Case Description</label>
<textarea
    id="00Nao00001LueZF"
    name="00Nao00001LueZF"
    rows="5"
    placeholder="Enter Case Description">
</textarea>
</div>    

<div class="full-width">
<label>Street Address</label>
<textarea name="street"></textarea>
</div>
  
<div>
<label>Zip Code</label>
<input type="text" name="zip">
</div>

<div>
<label>State / Province</label>
<input type="text" name="state">
</div>

<div>
<label>Country</label>
<input type="text" name="country">
</div>

<div>
<label>Rating</label>
<select name="rating">
<option value="">Select Rating</option>
<option value="Hot">Hot</option>
<option value="Warm">Warm</option>
<option value="Cold">Cold</option>
</select>
</div>

<div class="full-width">
<label>Lead Source</label>
<select name="lead_source">
<option value="">Select Source</option>
<option value="Web">Web</option>
<option value="Phone Inquiry">Phone Inquiry</option>
<option value="Partner Referral">Partner Referral</option>
<option value="Purchased List">Purchased List</option>
<option value="Other">Other</option>
</select>
</div>

<div class="full-width">
<button type="submit">Register</button>
</div>

</div>

</form>

</div>

</body>
</html>
